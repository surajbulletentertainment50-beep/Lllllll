name: Build Masti Video APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Project & Resources
        run: node scripts/prepare-android.js

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK 36 Tools & Licenses
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --include_preview "platforms;android-36" "build-tools;36.0.0" || true

      - name: Re-apply Android Config & SDK Path
        run: node scripts/prepare-android.js


      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Masti-Video.apk \;
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masti-Video-Debug-APK
          path: build-output/Masti-Video.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Masti Video APK v1.0.0"
          body: "Direct Downloadable APK for Masti Video Android App."
          draft: false
          prerelease: false
          files: build-output/Masti-Video.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
